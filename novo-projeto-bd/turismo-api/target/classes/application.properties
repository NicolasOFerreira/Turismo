spring.application.name=turismo-api

# Conexao com o banco: conta da APLICACAO (nunca root).
# A senha vem da variavel de ambiente DB_PASSWORD (nao fica no codigo).
spring.datasource.url=jdbc:mysql://localhost:3306/db_turismo?serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=app_operador
spring.datasource.password=${DB_PASSWORD}

# Datas em formato texto (2026-12-01) no JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# Nao vazar detalhes internos nas respostas de erro
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
